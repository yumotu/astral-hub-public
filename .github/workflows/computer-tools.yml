name: Verify computer tools (no release)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'server/relay*.mjs'
      - 'shared/computer-plugin.mjs'
      - 'web/src/Computer*.tsx'
      - 'tests/computer*.test.mjs'
      - '.github/workflows/computer-tools.yml'
permissions:
  contents: read
concurrency:
  group: computer-tools-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '26.7.0', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
  computer-runtime:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '26.7.0', cache: npm, cache-dependency-path: agent/package-lock.json }
      - run: npm ci
      - run: npm ci --prefix agent --ignore-scripts
      - run: npm --prefix agent run terminal:setup
      - run: node scripts/package-agent.mjs
      - run: node --test agent/tests/runtime.test.mjs agent/tests/relay-integration.test.mjs agent/tests/computer-tools.test.mjs agent/tests/plugins.test.mjs agent/tests/online-packages.test.mjs agent/tests/inputs.test.mjs agent/tests/long-goal-runtime.test.mjs agent/tests/document-ocr.test.mjs
